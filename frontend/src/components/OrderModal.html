<!-- 
  ==============================================================================
  ORDER DETAILS MODAL COMPONENT (HTML + CSS + JS)
  ==============================================================================
  Self-contained HTML component: includes markup, <style>, and <script>.
-->

<div id="order-modal-wrapper" class="modal-overlay" style="display: none;">
  <div class="modal-dialog-box">
    <!-- Header -->
    <div class="modal-head">
      <div>
        <div class="modal-title-row">
          <span class="modal-title" id="om-order-number">Order #--</span>
          <span class="modal-ticket-badge" id="om-queue-ticket">Queue #--</span>
        </div>
        <div class="modal-time-stamp" id="om-timestamp">Date & Time</div>
      </div>
      <button class="modal-close-cross" onclick="closeOrderModal()">&times;</button>
    </div>

    <!-- Status Progression Steps -->
    <div class="modal-progress-section">
      <div class="modal-steps-row" id="om-steps-row">
        <!-- Rendered dynamically by script -->
      </div>
    </div>

    <!-- Customer and Payment Details -->
    <div class="modal-meta-grid">
      <div class="modal-meta-card">
        <span class="meta-label">Customer</span>
        <span class="meta-val" id="om-customer-name">Walk-in</span>
        <span class="meta-sub" id="om-customer-phone"></span>
      </div>
      <div class="modal-meta-card">
        <span class="meta-label">Order & Payment</span>
        <span class="meta-val" id="om-order-type">Takeout</span>
        <span class="meta-sub text-green" id="om-payment-info">Cash &bull; Paid</span>
      </div>
    </div>

    <!-- Items List Table -->
    <div class="modal-items-section">
      <div class="items-heading">ORDER ITEMS</div>
      <div class="items-list-box" id="om-items-list">
        <!-- Rendered dynamically -->
      </div>
      <div class="items-total-row">
        <span>Total Amount</span>
        <span class="total-amount-val" id="om-total-price">₱0.00</span>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="modal-actions-footer">
      <button class="btn btn-secondary text-red" id="om-btn-cancel" onclick="cancelCurrentOrder()">
        Cancel Order
      </button>
      <div class="btn-group" id="om-dynamic-actions">
        <!-- Dynamic Next Status Buttons -->
      </div>
    </div>
  </div>
</div>

<style>
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .modal-dialog-box {
    width: 100%;
    max-width: 540px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    max-height: 90vh;
    overflow-y: auto;
    color: #f1f5f9;
  }
  .modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid #334155;
  }
  .modal-title-row { display: flex; align-items: center; gap: 10px; }
  .modal-title { font-size: 18px; font-weight: 800; color: #fff; }
  .modal-ticket-badge {
    background: rgba(249, 115, 22, 0.2);
    color: #fb923c;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 9999px;
  }
  .modal-time-stamp { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .modal-close-cross {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }
  .modal-close-cross:hover { color: #fff; }

  .modal-progress-section {
    margin: 20px 0;
    padding: 14px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 14px;
    overflow-x: auto;
  }
  .modal-steps-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .step-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-width: 60px;
  }
  .step-circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    border: 2px solid;
    margin-bottom: 4px;
  }
  .step-circle.done    { background: #10b981; border-color: #10b981; color: #fff; }
  .step-circle.current { background: #f97316; border-color: #f97316; color: #fff; }
  .step-circle.future  { background: #1e293b; border-color: #475569; color: #64748b; }
  .step-label { font-size: 10px; font-weight: 600; color: #94a3b8; }

  .modal-meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .modal-meta-card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .meta-label { font-size: 11px; color: #94a3b8; }
  .meta-val   { font-size: 14px; font-weight: 700; color: #fff; text-transform: capitalize; }
  .meta-sub   { font-size: 12px; color: #94a3b8; }

  .modal-items-section { margin-bottom: 20px; }
  .items-heading { font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; }
  .items-list-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 160px;
    overflow-y: auto;
  }
  .item-row {
    background: #0f172a;
    padding: 10px 14px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
  }
  .item-name { font-weight: 600; color: #fff; }
  .item-cost { font-weight: 800; color: #34d399; }
  .items-total-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    margin-top: 10px;
    border-top: 1px solid #334155;
    font-weight: 700;
  }
  .total-amount-val { font-size: 20px; font-weight: 800; color: #34d399; }

  .modal-actions-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid #334155;
    gap: 12px;
  }
</style>

<script>
  let viewingOrderObj = null;

  function openOrderModalById(orderId) {
    if (typeof queueOrdersData !== 'undefined') {
      const order = queueOrdersData.find(o => String(o.id) === String(orderId));
      if (order) populateAndShowModal(order);
    }
  }

  function populateAndShowModal(order) {
    viewingOrderObj = order;
    const modal = document.getElementById('order-modal-wrapper');
    if (!modal) return;

    document.getElementById('om-order-number').textContent = `Order #${order.order_number || order.id}`;
    document.getElementById('om-queue-ticket').textContent = `Queue #${order.queue_number || '--'}`;
    document.getElementById('om-timestamp').textContent = new Date(order.created_at || Date.now()).toLocaleString();
    document.getElementById('om-customer-name').textContent = order.customer_name || 'Walk-in Customer';
    document.getElementById('om-customer-phone').textContent = order.customer_phone || '';
    document.getElementById('om-order-type').textContent = order.order_type || 'Walk-in Pickup';
    document.getElementById('om-payment-info').textContent = `${order.payment_method || 'Cash'} • ${order.payment_status || 'Paid'}`;
    document.getElementById('om-total-price').textContent = `₱${Number(order.total || 0).toFixed(2)}`;

    // Items list
    const itemsList = document.getElementById('om-items-list');
    itemsList.innerHTML = (order.items || []).map(i => `
      <div class="item-row">
        <span class="item-name">${i.quantity}x ${i.product_name || i.name || 'Siomai'}</span>
        <span class="item-cost">₱${Number(i.subtotal || ((i.price || 0) * i.quantity)).toFixed(2)}</span>
      </div>
    `).join('');

    // Dynamic actions
    const actionBox = document.getElementById('om-dynamic-actions');
    actionBox.innerHTML = '';

    if (order.status === 'pending') {
      actionBox.innerHTML = `<button class="btn btn-primary" onclick="proceedOrderModalStatus('preparing')">🍳 Prepare</button>`;
    } else if (order.status === 'preparing') {
      actionBox.innerHTML = `<button class="btn btn-secondary" onclick="proceedOrderModalStatus('ready_pickup')">🔔 Mark Ready</button>`;
    } else if (['ready', 'ready_pickup'].includes(order.status)) {
      actionBox.innerHTML = `<button class="btn btn-success" onclick="proceedOrderModalStatus('completed')">✅ Complete Order</button>`;
    }

    modal.style.display = 'flex';
  }

  function closeOrderModal() {
    const modal = document.getElementById('order-modal-wrapper');
    if (modal) modal.style.display = 'none';
  }

  async function proceedOrderModalStatus(nextStatus) {
    if (!viewingOrderObj) return;
    await updateOrderStatusAction(viewingOrderObj.id, nextStatus);
    closeOrderModal();
  }

  async function cancelCurrentOrder() {
    if (!viewingOrderObj) return;
    if (confirm('Cancel this order?')) {
      await updateOrderStatusAction(viewingOrderObj.id, 'cancelled');
      closeOrderModal();
    }
  }

  window.openOrderModalById = openOrderModalById;
  window.closeOrderModal = closeOrderModal;
</script>
